[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wavedispx"
version = "0.2.0"
description = "Active/passive wavefield simulation, ambient-noise correlation, and dispersion analysis"
readme = "README_PYTHON_CN.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "h5py>=3.10",
    "disba>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["streamlit>=1.40"]
desktop = ["PySide6>=6.8"]
notebook = [
    "nbformat>=5.10",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[project.scripts]
wavedispx = "wavedispx.cli:main"
wavedispx-ui = "wavedispx.ui.launcher:main"
wavedispx-desktop = "wavedispx.desktop.launcher:main"

[tool.setuptools]
package-dir = {"" = "python_src"}

[tool.setuptools.packages.find]
where = ["python_src"]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
addopts = "-ra"
