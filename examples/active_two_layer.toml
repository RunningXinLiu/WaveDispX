[run]
name = "active_two_layer"
mode = "active"
output_directory = "../output_python/active_two_layer"
workers = 0                         # 0 = 自动使用物理核心数
frequency_block_size = 16
source_block_size = 1
radial_interpolation_step_m = 0.5
store_source_responses = false

[[model.layers]]
thickness_m = 10.0
vp_mps = 380.0
vs_mps = 220.0
density_kgm3 = 2000.0
qp = inf
qs = inf

[[model.layers]]
thickness_m = inf                   # 最后一层必须是半空间
vp_mps = 760.0
vs_mps = 440.0
density_kgm3 = 2000.0
qp = inf
qs = inf

[geometry.receivers]
layout = "line"
start_x_m = 1.0
stop_x_m = 200.0
spacing_m = 1.0
y_m = 0.0

[das]
enabled = false
geometry_mode = "uniform"
gauge_length_m = 10.0
measurement = "strain_rate"
fiber_azimuth_deg = 0.0

[active_source]
x_m = 0.0
y_m = 0.0
component = "both"                 # vertical / horizontal / both
wavelet = "ricker"
dominant_frequency_hz = 20.0
maximum_frequency_hz = 100.0
dt_s = 0.001
record_duration_s = 0.0             # 0 = model/group-velocity automatic design

[processing]
correlation_normalization = "none"
dispersion_method = "hankel"
frequency_min_hz = 4.0
frequency_max_hz = 50.0
velocity_min_mps = 100.0
velocity_max_mps = 580.0
velocity_step_mps = 1.0
distance_taper_fraction = 0.0
zero_padding = 5.0
radial_kernel_lookup_step = 0.002     # FJ/Hankel 核查表步长；0 = 逐点精确特殊函数
picker_smoothness = 0.3
picker_maximum_jump_mps = 25.0
picker_minimum_energy = 0.05
rayleigh_modes = 4
love_modes = 4
