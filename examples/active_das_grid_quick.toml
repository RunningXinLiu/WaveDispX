[run]
name = "active_das_grid_quick"
mode = "active"
output_directory = "../output_python/active_das_grid_quick"
workers = 4
frequency_block_size = 8
source_block_size = 1
radial_interpolation_step_m = 0.5
store_source_responses = false

[[model.layers]]
thickness_m = 10.0
vp_mps = 380.0
vs_mps = 220.0
density_kgm3 = 2000.0
qp = inf
qs = inf

[[model.layers]]
thickness_m = inf
vp_mps = 760.0
vs_mps = 440.0
density_kgm3 = 2000.0
qp = inf
qs = inf

[geometry.receivers]
layout = "grid"
start_x_m = -50.0
stop_x_m = 50.0
spacing_x_m = 10.0
start_y_m = -50.0
stop_y_m = 50.0
spacing_y_m = 10.0
distance_bin_m = 5.0

[das]
enabled = true
geometry_mode = "uniform"
gauge_length_m = 8.0
measurement = "strain_rate"
fiber_azimuth_deg = 0.0

[active_source]
x_m = -100.0
y_m = -30.0
component = "vertical"
wavelet = "ricker"
dominant_frequency_hz = 7.0
maximum_frequency_hz = 16.0
dt_s = 0.005
record_duration_s = 0.0             # 0 = model/group-velocity automatic design

[processing]
correlation_normalization = "none"
dispersion_method = "phase_shift"
theory_solver = "disba"
compare_methods = false
frequency_min_hz = 3.0
frequency_max_hz = 14.0
velocity_min_mps = 120.0
velocity_max_mps = 500.0
velocity_step_mps = 2.0
distance_taper_fraction = 0.2
zero_padding = 5.0
radial_kernel_lookup_step = 0.002
picker_smoothness = 0.3
picker_maximum_jump_mps = 30.0
picker_minimum_energy = 0.05
rayleigh_modes = 3
love_modes = 3
