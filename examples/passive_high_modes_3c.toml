[run]
name = "passive_high_modes_3c"
mode = "passive"
output_directory = "../output_python/passive_high_modes_3c"
workers = 0
frequency_block_size = 16
source_block_size = 16
radial_interpolation_step_m = 0.35
store_source_responses = false

[[model.layers]]
thickness_m = 5.0
vp_mps = 340.0
vs_mps = 180.0
density_kgm3 = 1850.0
qp = inf
qs = inf

[[model.layers]]
thickness_m = 15.0
vp_mps = 560.0
vs_mps = 300.0
density_kgm3 = 2000.0
qp = inf
qs = inf

[[model.layers]]
thickness_m = inf
vp_mps = 1050.0
vs_mps = 600.0
density_kgm3 = 2200.0
qp = inf
qs = inf

[geometry.receivers]
layout = "line"
start_x_m = -198.0
stop_x_m = 198.0
spacing_m = 3.0
y_m = 0.0

[das]
enabled = false
geometry_mode = "uniform"
gauge_length_m = 10.0
measurement = "strain_rate"
fiber_azimuth_deg = 0.0

[ambient_sources]
# Each physical source emits independent global Fx/Fy/Fz stochastic loads.
component = "three_component"
layout = "annulus"
count = 192
seed = 42
inner_radius_m = 450.0
outer_radius_m = 650.0
angular_sampling = "stratified"

[noise]
temporal_model = "stationary_gaussian"
seed = 314159
duration_s = 1800.0
dt_s = 0.005
window_s = 20.0
overlap = 0.0
psd_shape = "flat_band"
dominant_frequency_hz = 12.0
minimum_frequency_hz = 3.0
maximum_frequency_hz = 24.0
source_amplitude = 1.0
independent_sources = true
event_rate_hz = 0.4

[processing]
correlation_normalization = "spectral_whitening"
dispersion_method = "phase_shift"
compare_methods = true
frequency_min_hz = 3.5
frequency_max_hz = 23.5
velocity_min_mps = 130.0
velocity_max_mps = 650.0
velocity_step_mps = 2.0
distance_taper_fraction = 0.5
zero_padding = 8.0
radial_kernel_lookup_step = 0.002
picker_smoothness = 0.35
picker_maximum_jump_mps = 30.0
picker_minimum_energy = 0.05
rayleigh_modes = 4
love_modes = 4
