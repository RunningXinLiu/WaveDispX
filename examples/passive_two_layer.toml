[run]
name = "passive_two_layer"
mode = "passive"
output_directory = "../output_python/passive_two_layer"
workers = 0                         # 0 = 自动使用物理核心数
frequency_block_size = 16
source_block_size = 16
radial_interpolation_step_m = 0.5 # 不超过最短S波波长的5%
store_source_responses = false      # 默认流式叠加，避免数 GB 的 TT 数组

[[model.layers]]
thickness_m = 10.0
vp_mps = 380.0
vs_mps = 220.0
density_kgm3 = 2000.0
qp = inf
qs = inf

[[model.layers]]
thickness_m = inf
vp_mps = 760.0
vs_mps = 440.0
density_kgm3 = 2000.0
qp = inf
qs = inf

[geometry.receivers]
layout = "line"
start_x_m = -300.0
stop_x_m = 300.0
spacing_m = 5.0
y_m = 0.0

[ambient_sources]
component = "vertical"                # 当前稳定被动流程：竖直随机力 / Rayleigh 波
layout = "annulus"                 # annulus / road / line / file
count = 384
seed = 42
inner_radius_m = 800.0
outer_radius_m = 1200.0
angular_sampling = "stratified"    # random / stratified / uniform

[noise]
temporal_model = "stationary_gaussian"
seed = 314159
duration_s = 1800.0
dt_s = 0.005
window_s = 20.0
overlap = 0.0
psd_shape = "ricker"               # ricker / flat_band / file
dominant_frequency_hz = 12.0
minimum_frequency_hz = 3.0
maximum_frequency_hz = 18.8
source_amplitude = 1.0
independent_sources = true
event_rate_hz = 0.4                   # poisson_ricker 时每源平均事件率

[processing]
correlation_normalization = "spectral_whitening"
dispersion_method = "phase_shift"
frequency_min_hz = 5.0
frequency_max_hz = 18.8
velocity_min_mps = 150.0
velocity_max_mps = 500.0
velocity_step_mps = 2.0
distance_taper_fraction = 0.5
zero_padding = 8.0
radial_kernel_lookup_step = 0.002     # phase_shift 时不使用
picker_smoothness = 0.35
picker_maximum_jump_mps = 30.0
picker_minimum_energy = 0.05
rayleigh_modes = 4
love_modes = 4
