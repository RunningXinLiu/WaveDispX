name: Classroom private desktop candidates
on:
  workflow_dispatch:
  push:
    branches: [codex/classroom-packaging]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
          - os: macos-14
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: QtAgg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows native toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-eigen3 mingw-w64-x86_64-hdf5
      - name: Linux native and Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libeigen3-dev libhdf5-dev ninja-build libegl1 libopengl0 libxkbcommon0 fonts-noto-cjk
      - name: Mac native toolchain
        if: runner.os == 'macOS'
        run: brew install gcc eigen hdf5 ninja
      - name: Build native solvers on Windows
        id: native_windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          echo "mingw_bin=$(cygpath -w /mingw64/bin)" >> "$GITHUB_OUTPUT"
          cmake -S packaging/classroom/native -B native-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_Fortran_COMPILER=gfortran
          cmake --build native-build --parallel 2
      - name: Build native solvers on Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S packaging/classroom/native -B native-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native-build --parallel 2
      - name: Build native solvers on Mac
        if: runner.os == 'macOS'
        run: |
          FC=$(find "$(brew --prefix gcc)/bin" -name 'gfortran*' -type f | head -1)
          cmake -S packaging/classroom/native -B native-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER="$FC" -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build native-build --parallel 2
      - name: Build Python and C++ runtime
        run: |
          python -m pip install -r packaging/classroom/requirements.txt
          python setup.py build_ext --inplace
      - name: Freeze complete application
        shell: bash
        env:
          CLASSROOM_MINGW_BIN: ${{ steps.native_windows.outputs.mingw_bin }}
        run: |
          export CLASSROOM_NATIVE="$GITHUB_WORKSPACE/native-build/solvers"
          python packaging/classroom/freeze.py
      - name: Relocate and test shipped executable
        shell: bash
        run: python packaging/classroom/check_distribution.py --label "${{ matrix.label }}"
      - name: Upload candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            release/*
            smoke-output/**
            packaging/classroom/build_manifest.json
            build/classroom/warn-*.txt
