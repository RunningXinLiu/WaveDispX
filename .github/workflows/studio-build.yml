name: Studio desktop builds
on:
  workflow_dispatch:
  push:
    branches: [codex/studio-packaging-20261028]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, label: windows-x64}
          - {os: ubuntu-22.04, label: linux-x64}
          - {os: macos-14, label: macos-arm64}
          - {os: macos-15-intel, label: macos-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: QtAgg
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows native toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-eigen3 mingw-w64-x86_64-hdf5
      - name: Linux native and Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libeigen3-dev libhdf5-dev ninja-build libegl1 libopengl0 libxkbcommon0 fonts-noto-cjk
      - name: Mac native toolchain
        if: runner.os == 'macOS'
        run: brew install gcc eigen hdf5 ninja
      - name: Windows native solvers
        id: native_windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          echo "mingw_bin=$(cygpath -w /mingw64/bin)" >> "$GITHUB_OUTPUT"
          cmake -S packaging/studio/native -B native-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_Fortran_COMPILER=gfortran
          cmake --build native-build --parallel 2 --target forward qedisp_group
      - name: Linux native solvers
        if: runner.os == 'Linux'
        run: |
          cmake -S packaging/studio/native -B native-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native-build --parallel 2 --target forward qedisp_group
      - name: Mac native solvers
        if: runner.os == 'macOS'
        run: |
          FC=$(find "$(brew --prefix gcc)/bin" -name 'gfortran*' -type f | head -1)
          cmake -S packaging/studio/native -B native-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER="$FC" -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build native-build --parallel 2 --target forward qedisp_group
      - name: Python and C++ runtime
        run: |
          python -m pip install --only-binary=numba,llvmlite -r packaging/studio/requirements.txt
          python setup.py build_ext --inplace
      - name: Freeze Studio
        shell: bash
        env:
          CLASSROOM_MINGW_BIN: ${{ steps.native_windows.outputs.mingw_bin }}
        run: |
          export STUDIO_NATIVE="$GITHUB_WORKSPACE/native-build/solvers"
          python packaging/classroom/fetch_font.py
          python packaging/studio/freeze.py
      - name: Relocated native application checks
        run: python packaging/studio/check_distribution.py --label "${{ matrix.label }}"
      - name: Upload candidate only after test
        uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: error
          path: studio-release/*
      - name: Upload small QC separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-qc-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            studio-smoke-output/*.json
            studio-smoke-output/*.png
            studio-smoke-output/*.txt
            packaging/studio/build_manifest.json
            build/studio/warn-*.txt
